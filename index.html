<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form action="./next.html"
   <label><b>Student Name: </b></label>
   <input type="text" name="Name" placeholder="Enter your name" required><br><br>
   <label><b>Gender: </b><br>
   Male<input type="radio" name="gender" title="Male" ><br>
   Female<input type="radio" name="gender" title="Female" ><br>
   Other<input type="radio" name="gender" title="Other" >
   </label>
   <br><br>
   <label><b>DOB</b></label>
   <input type="date"  title="DOB"><br><br>
   <label><b>Choose a course</b></label>
   <select title="course" name="course"><br><br>
    <option>B.tech</option>
    <option>M.tech</option>
    <option>BCA</option> 
   </select><br><br>
   <label><b>Father's Name: </b></label>
   <input type="text" placeholder="Enter Father's name" required><br><br>
   <label><b>Mother's Name: </b></label>
   <input type="text" placeholder="Enter your Mother's name" required><br><br>
   <label><b>Phone no: </b></label>
   <input type="tel" placeholder="Enter your phone number" required><br><br>
   <label><b>Email: </b></label>
   <input type="email" placeholder="Enter your Email ID" required><br><br>
   <input type="submit" value="submit">
</form>
</body>
</html>
